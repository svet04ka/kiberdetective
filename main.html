<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кибердетектив: домашнее расследование</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b2440; --navy:#22305c; --paper:#fbf6e9; --paper2:#f3ead2;
    --yellow:#ffe66d; --yellow-d:#f2c94c; --green:#2fa86b; --green-l:#dff5e8;
    --red:#e0524a; --red-l:#fde3e1; --blue:#4a7bd8; --muted:#6b6f80;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Rubik,system-ui,sans-serif;color:var(--ink);
    background:#1b2440 radial-gradient(circle at 20% 0%, #2f4180 0, transparent 50%);min-height:100vh}
  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
  h1,h2,h3{font-family:"Russo One",Rubik,sans-serif;font-weight:400;margin:0}
  header{color:#fff;text-align:center;padding:18px 0 8px}
  header .badge{display:inline-block;background:var(--yellow);color:var(--ink);font-weight:700;
    padding:4px 12px;border-radius:999px;font-size:13px;letter-spacing:.5px;transform:rotate(-2deg)}
  header h1{font-size:clamp(26px,5vw,40px);margin:12px 0 6px}
  header p{opacity:.85;margin:0 auto;max-width:560px;line-height:1.5}

  /* evidence board */
  .board{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:22px 0 18px}
  .clue{background:#2c3a6b;border:2px dashed #5b6aa0;border-radius:14px;padding:10px 4px;text-align:center;
    color:#c9d0ee;cursor:pointer;transition:.15s;font:inherit}
  .clue:hover{transform:translateY(-2px)}
  .clue .ic{font-size:24px;display:block}
  .clue .nm{font-size:11px;display:block;margin-top:4px;line-height:1.2}
  .clue .lt{font-family:"Russo One";font-size:20px;display:block;margin-top:4px;color:#5b6aa0}
  .clue.done{background:var(--yellow);border:2px solid var(--yellow-d);color:var(--ink)}
  .clue.done .lt{color:var(--ink)}
  .clue.active{outline:3px solid #fff;outline-offset:2px}
  .secret{color:#fff;text-align:center;margin-bottom:18px;font-size:14px;opacity:.9}
  .secret b{font-family:"Russo One";letter-spacing:6px;font-size:22px;color:var(--yellow)}

  /* case file */
  .file{background:var(--paper);border-radius:6px 18px 18px 18px;padding:26px 22px 28px;position:relative;
    box-shadow:0 12px 30px rgba(0,0,0,.35)}
  .file:before{content:"";position:absolute;top:-16px;left:0;width:170px;height:18px;background:var(--paper);
    border-radius:10px 10px 0 0}
  .file .tag{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .file h2{font-size:24px;margin:4px 0 10px}
  .intro{background:var(--paper2);border-left:5px solid var(--yellow-d);padding:12px 14px;border-radius:8px;line-height:1.5;margin-bottom:18px}
  .note{background:#fff7c2;padding:10px 14px;border-radius:8px;font-size:14px;line-height:1.45;margin:14px 0;transform:rotate(-.4deg);
    box-shadow:0 2px 0 rgba(0,0,0,.08)}

  .card{background:#fff;border-radius:14px;padding:16px;margin:14px 0;border:2px solid #ece4cc}
  .card.solved{border-color:var(--green)}
  .q{font-weight:500;line-height:1.45;margin-bottom:12px}
  .qn{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:1px 8px;font-size:13px;margin-right:6px}
  .msg{background:#eef2fb;border:1px solid #c8d4f0;border-radius:4px 16px 16px 16px;padding:10px 14px;margin:6px 0 12px;max-width:520px}
  .msg .from{font-size:12px;font-weight:700;color:var(--blue);margin-bottom:3px}
  .url{font-family:ui-monospace,Menlo,Consolas,monospace;background:#f1f1f4;padding:2px 6px;border-radius:6px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opts.row{flex-direction:row;flex-wrap:wrap}
  .opt{font:inherit;text-align:left;background:#f7f4ea;border:2px solid #e5dcc0;border-radius:12px;padding:10px 14px;cursor:pointer;transition:.12s}
  .opts.row .opt{flex:1;min-width:140px;text-align:center;font-weight:500}
  .opt:hover:not(:disabled){border-color:var(--ink)}
  .opt.ok{background:var(--green-l);border-color:var(--green)}
  .opt.bad{background:var(--red-l);border-color:var(--red);text-decoration:line-through;opacity:.8}
  .opt:disabled{cursor:default}
  .fb{margin-top:10px;font-size:14px;line-height:1.45;padding:9px 12px;border-radius:10px;display:none}
  .fb.show{display:block}
  .fb.good{background:var(--green-l)}
  .fb.try{background:var(--red-l)}

  /* passwords */
  .pwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
  .pw{font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;background:#fff;border:2px solid #e5dcc0;
    border-radius:12px;padding:12px;cursor:pointer;text-align:left}
  .pw.sel{border-color:var(--blue);background:#e8efff}
  .pw.ok{border-color:var(--green);background:var(--green-l)}
  .pw.bad{border-color:var(--red);background:var(--red-l)}
  .pw small{display:block;font-family:Rubik;font-size:12px;color:var(--muted);margin-top:4px}
  .btn{font:inherit;font-weight:700;background:var(--ink);color:#fff;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;margin-top:14px}
  .btn.y{background:var(--yellow);color:var(--ink)}
  .btn:disabled{opacity:.4;cursor:default}
  input[type=text]{font:inherit;font-size:18px;width:100%;padding:12px 14px;border:2px solid #d9cfb2;border-radius:12px;background:#fff}
  input[type=text]:focus{outline:none;border-color:var(--blue)}
  .rules{list-style:none;padding:0;margin:12px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
  .rules li{padding:6px 10px;border-radius:8px;background:#f1ece0;font-size:14px}
  .rules li.on{background:var(--green-l)}
  .meter{height:12px;border-radius:99px;background:#eee;margin-top:12px;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:var(--red);transition:.25s}

  .check{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid #ece4cc;border-radius:14px;padding:14px;margin:10px 0;cursor:pointer}
  .check input{width:22px;height:22px;flex-shrink:0;margin-top:2px;accent-color:var(--green)}
  .check.on{border-color:var(--green);background:#f6fdf9}

  .done-banner{display:none;text-align:center;background:var(--yellow);border-radius:14px;padding:16px;margin-top:20px}
  .done-banner.show{display:block}
  .done-banner .big{font-family:"Russo One";font-size:40px}
  .nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px}

  /* certificate */
  .cert{text-align:center;border:4px double var(--ink);border-radius:18px;padding:26px 18px;background:#fffdf5}
  .cert .medal{font-size:64px}
  .cert h2{font-size:28px;margin:8px 0}
  .cert .name{font-family:"Russo One";font-size:30px;color:var(--blue);margin:10px 0;min-height:36px}
  .stamp{display:inline-block;border:3px solid var(--red);color:var(--red);font-family:"Russo One";padding:6px 14px;border-radius:8px;
    transform:rotate(-6deg);margin-top:12px;letter-spacing:2px}
  .stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:16px 0}
  .stat{background:var(--paper2);border-radius:12px;padding:10px 16px}
  .stat b{font-family:"Russo One";font-size:24px;display:block}
  .hidden{display:none}
  @media (max-width:560px){
    .board{grid-template-columns:repeat(3,1fr)}
    .file{padding:22px 14px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">🕵️ ДОМАШНЕЕ ЗАДАНИЕ · СЕКРЕТНО</span>
    <h1>Дело №1: Кибердетектив</h1>

  </header>

  <div class="board" id="board"></div>
  <div class="secret">Секретное слово: <b id="word">_ _ _ _ _ _</b></div>

  <div class="file" id="file"></div>
</div>

let S = {cur:0, done:{}, ans:{}, first:{}, pwSel:[], pwChecked:false, pwOk:false, myPw:false, checks:{}, name:""};
try{ const s = JSON.parse(localStorage.getItem("cyberdet-hw")||"null"); if(s) S = Object.assign(S,s);}catch(e){}

const $ = s => document.querySelector(s);
const allDone = () => MISSIONS.every(m => S.done[m.id]);

function renderBoard(){
  $("#board").innerHTML = MISSIONS.map((m,i)=>`
    <button class="clue ${S.done[m.id]?"done":""} ${S.cur===i?"active":""}" onclick="go(${i})">
      <span class="ic">${m.icon}</span><span class="nm">${m.name}</span>
      <span class="lt">${S.done[m.id]?LETTERS[i]:"?"}</span>
    </button>`).join("");
  $("#word").textContent = LETTERS.map((l,i)=>S.done[MISSIONS[i].id]?l:"_").join(" ");
}

function go(i){ S.cur=i; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }

function render(){
  renderBoard();
  if(S.cur===6){ renderCert(); return; }
  const m = MISSIONS[S.cur];
  let body = "";
  if(m.type==="passwords") body = pwHTML();
  if(m.type==="quiz") body = quizHTML(m);
  if(m.type==="checklist") body = checkHTML(m);
  $("#file").innerHTML = `
    <div class="tag">Улика ${S.cur+1} из 6</div>
    <h2>${m.icon} ${m.name}</h2>
    <div class="intro">${m.intro}</div>
    ${body}
    <div class="done-banner ${S.done[m.id]?"show":""}" id="banner">
      Улика найдена! Твоя буква: <div class="big">${LETTERS[S.cur]}</div>
    </div>
    <div class="nav">
      <button class="btn" ${S.cur===0?"disabled":""} onclick="go(${S.cur-1})">← Назад</button>
      ${S.cur<5 ? `<button class="btn y" onclick="go(${S.cur+1})">Следующая улика →</button>`
               : `<button class="btn y" ${allDone()?"":"disabled"} onclick="go(6)">Раскрыть дело 🏅</button>`}
    </div>`;
  if(m.type==="passwords") bindPw();
}

function finish(id){
  if(!S.done[id]){ S.done[id]=true; save(); }
  renderBoard();
  const b=$("#banner"); if(b) b.classList.add("show");
  const nb=document.querySelector(".nav .btn.y"); if(nb && allDone()) nb.disabled=false;
}

// ---------- passwords ----------
function pwHTML(){
  return `
  <div class="card">
    <div class="q"><span class="qn">Часть 1</span>Нажми на <b>все надёжные</b> пароли, потом нажми «Проверить».</div>
    <div class="note">📌 Вспомни правила: минимум <b>8 символов</b>, <b>большие</b> и <b>маленькие</b> буквы, <b>цифры</b> и <b>специальные символы</b> (! @ # $ % _ &).</div>
    <div class="pwgrid" id="pwgrid"></div>
    <button class="btn" id="pwcheck">Проверить</button>
    <div class="fb" id="pwfb"></div>
  </div>
  <div class="card ${S.myPw?"solved":""}" id="mycard">
    <div class="q"><span class="qn">Часть 2</span>Придумай свой <b>учебный</b> пароль-крепость. Сканер проверит, выдержит ли он атаку мошенника.</div>
    <div class="note">⚠️ Не вводи свои настоящие пароли! Придумай новый, только для тренировки. Подсказка: возьми два слова, замени букву символом и добавь цифру. Например, Кот + Луна → <span class="url">K0t#Luna5</span></div>
    <input type="text" id="mypw" placeholder="Введи учебный пароль…" autocomplete="off">
    <div class="meter"><i id="meter"></i></div>
    <ul class="rules" id="rules"></ul>
    <div class="fb" id="myfb"></div>
  </div>`;
}
function drawPw(){
  $("#pwgrid").innerHTML = PASSWORDS.map((x,i)=>{
    let cls = S.pwSel.includes(i)?"sel":"";
    let sm = "";
    if(S.pwChecked){ const sel=S.pwSel.includes(i);
      if(sel && x.ok){cls="ok"; sm="✅ "+x.why;}
      else if(sel && !x.ok){cls="bad"; sm="❌ "+x.why;}
      else if(!sel && x.ok && S.pwOk){cls="ok"; sm="✅ "+x.why;}
    }
    return `<button class="pw ${cls}" data-i="${i}">${x.p}${sm?`<small>${sm}</small>`:""}</button>`;
  }).join("");
}
const RULES = [
 ["8+ символов", s=>s.length>=8],
 ["большая буква", s=>/[A-ZА-ЯЁ]/.test(s)],
 ["маленькая буква", s=>/[a-zа-яё]/.test(s)],
 ["цифра", s=>/\d/.test(s)],
 ["спецсимвол", s=>/[^A-Za-zА-Яа-яЁё0-9\s]/.test(s)]
];
function bindPw(){
  drawPw();
  $("#pwgrid").onclick = e=>{
    const b=e.target.closest(".pw"); if(!b||S.pwOk) return;
    const i=+b.dataset.i; S.pwChecked=false;
    S.pwSel = S.pwSel.includes(i)? S.pwSel.filter(x=>x!==i) : [...S.pwSel,i];
    save(); drawPw(); $("#pwfb").className="fb";
  };
  $("#pwcheck").onclick = ()=>{
    S.pwChecked=true;
    const right = PASSWORDS.every((x,i)=>x.ok===S.pwSel.includes(i));
    const fb=$("#pwfb");
    if(right){ S.pwOk=true; fb.className="fb show good"; fb.innerHTML="🎉 Отлично! Ты нашёл все три надёжных пароля. Ни один слабый пароль тебя не обманул.";}
    else{
      if(S.first.pw===undefined) S.first.pw=false;
      const missed = PASSWORDS.filter((x,i)=>x.ok && !S.pwSel.includes(i)).length;
      fb.className="fb show try";
      fb.innerHTML = "🔎 Почти! Красным отмечены слабые пароли, которые ты выбрал."+(missed?` А ещё ты пропустил надёжных паролей: ${missed}.`:"")+" Нажми на пароли ещё раз, чтобы исправить.";
    }
    if(S.first.pw===undefined) S.first.pw=right;
    save(); drawPw(); checkPwDone();
  };
  if(S.pwOk){ $("#pwfb").className="fb show good"; $("#pwfb").innerHTML="🎉 Все надёжные пароли найдены!"; }
  const inp=$("#mypw");
  const upd=()=>{
    const s=inp.value, n=RULES.filter(r=>r[1](s)).length;
    $("#rules").innerHTML = RULES.map(r=>`<li class="${r[1](s)?"on":""}">${r[1](s)?"✅":"⬜"} ${r[0]}</li>`).join("");
    const m=$("#meter"); m.style.width=(n/5*100)+"%";
    m.style.background = n<3?"var(--red)":n<5?"var(--yellow-d)":"var(--green)";
    const fb=$("#myfb");
    if(n===5 && /^(.)\1+$/.test(s)===false){
      if(!S.myPw){S.myPw=true; save();}
      fb.className="fb show good"; fb.innerHTML="🛡️ Пароль-крепость! Мошенник такой не подберёт. Запиши его в тетрадь как пример.";
      $("#mycard").classList.add("solved"); checkPwDone();
    } else if(s){ fb.className="fb show try"; fb.innerHTML="Сканер нашёл слабые места. Добавь то, что ещё не отмечено галочкой."; }
    else fb.className="fb";
  };
  inp.oninput=upd; upd();
  if(S.myPw && !inp.value){ $("#myfb").className="fb show good"; $("#myfb").innerHTML="🛡️ Ты уже создал пароль-крепость. Можешь потренироваться ещё!"; }
}
function checkPwDone(){ if(S.pwOk && S.myPw) finish("pw"); }

// ---------- quiz ----------
function quizHTML(m){
  return m.qs.map((q,i)=>{
    const key=m.id+i, a=S.ans[key]||[];
    const solved=a.includes(q.a);
    return `<div class="card ${solved?"solved":""}" id="c-${key}">
      <div class="q"><span class="qn">${i+1}</span>${q.from?"":q.q}</div>
      ${q.from?`<div class="msg"><div class="from">${q.from}</div>${q.text}</div><div class="q">${q.q}</div>`:""}
      <div class="opts ${m.row?"row":""}">
        ${q.opts.map((o,j)=>{
          const cls = a.includes(j)?(j===q.a?"ok":"bad"):"";
          return `<button class="opt ${cls}" ${solved?"disabled":""} onclick="pick('${m.id}',${i},${j})">${o}</button>`;}).join("")}
      </div>
      <div class="fb ${solved?"show good":""}" id="f-${key}">${solved?"✅ "+q.why:""}</div>
    </div>`;
  }).join("");
}
function pick(mid,i,j){
  const m=MISSIONS.find(x=>x.id===mid), q=m.qs[i], key=mid+i;
  S.ans[key]=[...(S.ans[key]||[]),j];
  if(S.first[key]===undefined) S.first[key]=(j===q.a);
  const card=$("#c-"+key), btns=card.querySelectorAll(".opt"), fb=$("#f-"+key);
  if(j===q.a){
    btns[j].classList.add("ok"); btns.forEach(b=>b.disabled=true);
    card.classList.add("solved");
    fb.className="fb show good"; fb.innerHTML="✅ "+q.why;
  } else {
    btns[j].classList.add("bad"); btns[j].disabled=true;
    fb.className="fb show try"; fb.innerHTML="🤔 Не совсем! Подумай, кто и зачем мог это написать, и попробуй ещё раз.";
  }
  save();
  if(m.qs.every((qq,k)=>(S.ans[mid+k]||[]).includes(qq.a))) finish(mid);
}

// ---------- checklist ----------
function checkHTML(m){
  return m.items.map((t,i)=>`
    <label class="check ${S.checks[i]?"on":""}">
      <input type="checkbox" ${S.checks[i]?"checked":""} onchange="tick(${i},this)"><span>${t}</span>
    </label>`).join("") + `<div class="note">✍️ Отмечай честно: настоящие детективы не жульничают!</div>`;
}
function tick(i,el){
  S.checks[i]=el.checked; el.parentElement.classList.toggle("on",el.checked); save();
  if(MISSIONS[5].items.every((_,k)=>S.checks[k])) finish("real");
}

// ---------- certificate ----------
function renderCert(){
  const keys = Object.keys(S.first), firstOk = keys.filter(k=>S.first[k]).length;
  const total = 1 + MISSIONS.filter(m=>m.qs).reduce((s,m)=>s+m.qs.length,0);
  const pct = firstOk/total;
  const rank = pct>=.9?"Главный кибердетектив":pct>=.7?"Старший кибердетектив":"Кибердетектив-стажёр";
  $("#file").innerHTML = `
   <div class="cert">
     <div class="medal">🏅</div>
     <div class="tag">Дело №1 раскрыто!</div>
     <h2>Секретное слово — «ЗАЩИТА»</h2>
     <p>Именно ЗАЩИТА от мошенников — главная задача кибердетектива. Удостоверение выдано:</p>
     <input type="text" id="nm" placeholder="Впиши своё имя" value="${S.name.replace(/"/g,"&quot;")}" style="max-width:320px;text-align:center">
     <div class="name" id="nmv">${S.name||"…"}</div>
     <div>Звание: <b>${rank}</b></div>
     <div class="stats">
       <div class="stat"><b>6/6</b>улик собрано</div>
       <div class="stat"><b>${firstOk}/${total}</b>ответов с первой попытки</div>
     </div>
     <div class="stamp">ДЕЛО ЗАКРЫТО</div>
     <p style="font-size:14px;color:var(--muted);margin-top:18px">📷 Сделай скриншот удостоверения и покажи учителю на следующем уроке!</p>
   </div>
   <div class="card">
     <div class="q">🗂️ Памятка кибердетектива: запомни навсегда</div>
     <ol style="line-height:1.7;margin:0;padding-left:20px">
       <li>Пароль: 8+ символов, большие и маленькие буквы, цифры, спецсимволы. И никому его не говори!</li>
       <li>Коды из СМС не сообщай никому, даже «маме с нового номера».</li>
       <li>Не переходи по ссылкам с «выигрышами» и «срочными» просьбами.</li>
       <li>Перед вводом пароля проверь адрес сайта по буквам.</li>
       <li>Не публикуй адрес, школу, фото из окна и планы на отпуск.</li>
       <li>Что-то пошло не так? Сразу расскажи взрослым.</li>
     </ol>
   </div>
   <div class="nav"><button class="btn" onclick="go(5)">← Назад к уликам</button>
     <button class="btn" onclick="resetAll()" style="background:#8a8fa3">Начать заново</button></div>`;
  $("#nm").oninput=e=>{S.name=e.target.value; $("#nmv").textContent=S.name||"…"; save();};
}
function resetAll(){ S={cur:0,done:{},ans:{},first:{},pwSel:[],pwChecked:false,pwOk:false,myPw:false,checks:{},name:""}; save(); render(); }

if(S.cur===6 && !allDone()) S.cur=0;
render();
</script>
</body>
</html>
